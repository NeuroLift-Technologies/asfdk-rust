name: ASFDK Rust Governance Validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-governance.yml'
      - '.nltotoi/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'NLT-DEV-OTOI.md'
      - 'templates/**'
      - 'SOPs/**'
      - 'ISSUE_TEMPLATE/**'
      - 'PULL_REQUEST_TEMPLATE/**'
      - 'src/**'
      - 'Cargo.toml'
  pull_request:
    paths:
      - '.github/workflows/validate-governance.yml'
      - '.nltotoi/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'NLT-DEV-OTOI.md'
      - 'templates/**'
      - 'SOPs/**'
      - 'ISSUE_TEMPLATE/**'
      - 'PULL_REQUEST_TEMPLATE/**'
      - 'src/**'
      - 'Cargo.toml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check governance status
        run: bash .nltotoi/scripts/validate-governance.sh
      - name: Format check
        run: cargo fmt --check
      - name: Build
        run: cargo build --locked
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
